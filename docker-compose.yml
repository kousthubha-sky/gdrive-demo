services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drive
      POSTGRES_PASSWORD: drive
      POSTGRES_DB: drive
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drive -d drive"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # Google OAuth, JWT and S3 values come from your .env; the database is the
    # container above, so DATABASE_URL is overridden here.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://drive:drive@db:5432/drive
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
